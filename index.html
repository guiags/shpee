

<script>
async function salvarCoordenadas() {
  const status = document.getElementById("status");

  if (!navigator.geolocation) {
    status.textContent = "Geolocalização não suportada.";
    return;
  }

  navigator.geolocation.getCurrentPosition(async pos => {
    try {
      const resposta = await fetch("/salvar", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          latitude: pos.coords.latitude,
          longitude: pos.coords.longitude
        })
      });

      if (!resposta.ok) throw new Error();

      status.textContent = "Coordenadas salvas com sucesso!";
    } catch {
      status.textContent = "Não foi possível salvar as coordenadas.";
    }
  }, () => {
    status.textContent = "Permita o acesso à localização.";
  }, {
    enableHighAccuracy: true,
    timeout: 15000
  });
}

// Executa automaticamente ao abrir a página
window.addEventListener("load", salvarCoordenadas);
</script>
